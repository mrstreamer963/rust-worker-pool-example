[package]
name = "worker-pool-demo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "native_main"
path = "examples/native_main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Нативные зависимости (включены по умолчанию)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"], optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["native"]
native = ["tokio", "rayon"]
web = ["wasm-bindgen", "web-sys", "js-sys", "serde-wasm-bindgen"]