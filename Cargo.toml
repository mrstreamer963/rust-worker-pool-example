[package]
name = "worker-pool-demo"
version = "0.1.0"
edition = "2021"
description = "Rust worker pool demo for native and WebAssembly targets"
repository = "https://github.com/mrstreamer963/rust-worker-pool-example"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

# Нативные зависимости (по умолчанию)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
rayon = { version = "1.10" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Window",
    "Worker",
    "Blob",
    "Url"
] }
serde-wasm-bindgen = "0.6"
