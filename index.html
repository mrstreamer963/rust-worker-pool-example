<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Worker Pool Demo (with Queue)</title>
</head>

<body>
    <h2>Worker Pool with Task Queue</h2>
    <button id="run">Run 10 Tasks (Pool Size = 3)</button>
    <pre id="output" style="background:#f5f5f5; padding:10px; margin-top:10px;"></pre>

    <script type="module">
        import init from './pkg/worker_pool_demo.js';
        import { WorkerPool } from './worker_pool.js';

        let pool = null;

        async function run() {
            document.getElementById('output').textContent = 'Initializing...';
            await init();

            pool = new WorkerPool('./worker.js', 3);

            const tasks = Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                payload: `task-${i + 1}`
            }));

            console.time("Tasks completed");
            try {
                const results = await Promise.all(tasks.map(t => pool.runTask(t)));
                console.timeEnd("Tasks completed");
                document.getElementById('output').textContent =
                    `✅ Completed ${results.length} tasks:\n` +
                    JSON.stringify(results, null, 2);
            } catch (err) {
                console.error(err);
                document.getElementById('output').textContent = '❌ Error: ' + err.message;
            }
        }

        document.getElementById('run').onclick = run;

        window.addEventListener('beforeunload', () => {
            if (pool) pool.destroy();
        });
    </script>
</body>

</html>
